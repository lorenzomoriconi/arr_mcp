# Sanitized opt-in example, not a production deployment.
# URLs, credentials and token are supplied privately by the operator.
server:
  transport: http
  addr: 0.0.0.0:8080
  path: /rpc
  stateless: true
  jsonResponse: true
  # Set allowedPeers to the actual reverse-proxy source IP/CIDR in production.
  logLevel: info
  bearerToken: ${ARR_MCP_HTTP_TOKEN}
downloads:
  guarded: true
  client: main
permissions:
  # Trusted delegated automation: the model can read the scoped MCP token.
  # This token is constrained by server guards, not a separate human identity.
  # Installed Hermes does not yet handle modern input-required approval retries.
  mode: full
  fallback: deny
tools:
  denyDestructive: true
  allow:
    - sonarr_list_series
    - sonarr_get_series
    - sonarr_search_series
    - sonarr_list_episodes
    - sonarr_list_episode_files
    - sonarr_list_quality_profiles
    - sonarr_get_quality_profile
    - sonarr_create_quality_profile
    - sonarr_list_quality_definitions
    - sonarr_list_custom_formats
    - sonarr_get_custom_format
    - sonarr_system_status
    - sonarr_health
    - sonarr_magnet_preview
    - sonarr_add_magnet
    - sonarr_edit_series
    - sonarr_list_root_folders
    - sonarr_queue
    - sonarr_history
    - sonarr_get_command
    - sonarr_list_commands
    - sonarr_add_series
    - sonarr_trigger_search
    - sonarr_list_releases
    - sonarr_grab_release
    - sonarr_manual_import_preview
    - sonarr_manual_import
    - sonarr_update_quality_profile
    - radarr_list_movies
    - radarr_get_movie
    - radarr_search_movies
    - radarr_list_movie_files
    - radarr_list_quality_profiles
    - radarr_get_quality_profile
    - radarr_create_quality_profile
    - radarr_list_quality_definitions
    - radarr_list_custom_formats
    - radarr_get_custom_format
    - radarr_system_status
    - radarr_health
    - radarr_magnet_preview
    - radarr_add_magnet
    - radarr_edit_movies
    - radarr_list_root_folders
    - radarr_queue
    - radarr_history
    - radarr_get_command
    - radarr_list_commands
    - radarr_add_movie
    - radarr_trigger_search
    - radarr_list_releases
    - radarr_grab_release
    - radarr_manual_import_preview
    - radarr_manual_import
    - radarr_update_quality_profile
    - qbittorrent_list_torrents
    - qbittorrent_torrent_files
    - qbittorrent_stop_torrents
    - qbittorrent_start_torrents
    - qbittorrent_recheck_torrents
    - qbittorrent_reannounce_torrents
    - qbittorrent_system_status
    - qbittorrent_transfer_info
    - qbittorrent_list_categories
    - prowlarr_system_status
    - prowlarr_health
imports:
  guarded: true
services:
  sonarr:
    - name: main
      url: ${SONARR_URL}
      apiKey: ${SONARR_API_KEY}
      default: true
  radarr:
    - name: main
      url: ${RADARR_URL}
      apiKey: ${RADARR_API_KEY}
      default: true
  qbittorrent:
    - name: main
      url: ${QBITTORRENT_URL}
      username: ${QBITTORRENT_USERNAME}
      password: ${QBITTORRENT_PASSWORD}
      default: true
  prowlarr:
    - name: main
      url: ${PROWLARR_URL}
      apiKey: ${PROWLARR_API_KEY}
      default: true
